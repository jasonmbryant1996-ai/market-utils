name: BTC Regime Monitor

on:
  schedule:
    # Safety net only — every 6 hours in case the self-chain trigger below
    # ever fails to fire. The REAL continuity mechanism is the "Trigger
    # next run" step at the end of this job, not this cron schedule.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # only needed for this repo's own git history now
                     # (code checkout) — state no longer lives here.

concurrency:
  group: regime-monitor
  cancel-in-progress: false   # queue, don't kill an in-progress loop

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # hard platform cap on GitHub-hosted runners is 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt --quiet

      - name: Restore feature cache
        uses: actions/cache@v4
        with:
          path: /tmp/regime_feature_cache.pkl
          key: feature-cache-${{ github.run_id }}
          restore-keys: |
            feature-cache-

      - name: Fetch private core
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          REGIME_CORE_DIR="${RUNNER_TEMP}/regime-core"
          gh repo clone jasonmbryant1996-ai/regime-core "$REGIME_CORE_DIR" -- --depth=1

          cp "$REGIME_CORE_DIR"/src/features.py         src/features.py
          cp "$REGIME_CORE_DIR"/src/model_arch.py       src/model_arch.py
          cp "$REGIME_CORE_DIR"/src/model_registry.py   src/model_registry.py
          cp "$REGIME_CORE_DIR"/src/live_monitor.py     src/live_monitor.py
          cp "$REGIME_CORE_DIR"/src/paper_trader.py     src/paper_trader.py
          cp "$REGIME_CORE_DIR"/src/ifvg_state.py       src/ifvg_state.py
          cp "$REGIME_CORE_DIR"/src/feature_cache.py    src/feature_cache.py

          # State (last_signal.json) now lives INSIDE this regime-core
          # checkout, not in this (public) repo
          # Keep the clone around for the rest of the job (RUNNER_TEMP
          # survives the job, gets wiped after) instead of deleting it, so
          # later steps can read/write/commit/push state there directly.
          mkdir -p "$REGIME_CORE_DIR/state"
          git -C "$REGIME_CORE_DIR" config user.email "regime-bot@users.noreply.github.com"
          git -C "$REGIME_CORE_DIR" config user.name  "regime-monitor-bot"

          # Authenticate the push remote once, here, while GH_TOKEN is in
          # scope for this step. This persists in the clone's local git
          # config for the rest of the job, so later steps (which don't
          # carry GH_PAT in their own env) can still `git push` from it.
          # GitHub Actions automatically masks the literal secret value in
          # all logs, including if this URL is ever echoed.
          git -C "$REGIME_CORE_DIR" remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/jasonmbryant1996-ai/regime-core.git"

          echo "REGIME_CORE_CHECKOUT=$REGIME_CORE_DIR" >> "$GITHUB_ENV"
          echo "Private core fetched (7 files). State checkout kept at $REGIME_CORE_DIR."

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          for MODEL_NAME in bear_6h bull_48h; do
            ARTIFACT_ID=$(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name==\"regime-model-${MODEL_NAME}\" and .expired==false)] | sort_by(.created_at) | last | .id")

            if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
              echo "ERROR: no non-expired artifact named regime-model-${MODEL_NAME} found."
              echo "Either upload_model.py hasn't been run for this model yet, or GH_PAT"
              echo "lacks Actions read access to this (private) repo — check its scope."
              exit 1
            fi

            gh api "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              > "/tmp/model_${MODEL_NAME}.zip"

            mkdir -p "model/${MODEL_NAME}"
            unzip -o -q "/tmp/model_${MODEL_NAME}.zip" -d "model/${MODEL_NAME}/"
            echo "  ✓ ${MODEL_NAME} ready"
          done
          echo "All model artifacts downloaded."

      - name: Notify job start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
        run: python src/notify_job.py start

      - name: Run regime monitor loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          JOB_START_TS=$(date +%s)
          echo "JOB_START_EPOCH=$JOB_START_TS" >> "$GITHUB_ENV"

          END_TIME=$(( JOB_START_TS + 335*60 ))   # ~5h35m, buffer under 350min timeout
          ITERATION=1
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            python src/live_monitor.py || echo "Monitor run failed — continuing loop"
            echo "ITERATIONS=$ITERATION" >> "$GITHUB_ENV"
            ITERATION=$((ITERATION + 1))
            sleep 300
          done
          echo "ITERATIONS=$ITERATION" >> "$GITHUB_ENV"

      # ── Self-chain: immediately trigger the next run ────────────────────────
      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run regime_monitor.yml --repo ${{ github.repository }} --ref main

      - name: Notify job end
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
        run: python src/notify_job.py end